spring.application.name=eventos-service
server.port=8082

spring.config.import=configserver:${CONFIG_SERVER_URI:http://localhost:8888}
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=10
spring.cloud.config.retry.initial-interval=3000
spring.cloud.config.retry.max-interval=10000
spring.cloud.config.retry.multiplier=1.5

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=cl.duocuc.bancoxyz.eventosservice.model.TransaccionEventRecibido
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=${app.kafka.group-id:eventos-service-group}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWKS_URI:http://localhost:8080/realms/bancoxyz/protocol/openid-connect/certs}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
